<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18209594553"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AceEd Tutoring</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signin-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .signin-container h1 {
            color: #1e2a3a;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .signin-container p {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn-signin {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52,152,219,0.3);
        }
        
        .btn-signin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }
        
        .signup-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: 5px;
        }
        
        .forgot-password a {
            color: #3498db;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <h1><i class="fas fa-sign-in-alt"></i> Welcome Back</h1>
        <p>Sign in to access your account</p>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="signinForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            
            <!-- Forgot Password Link -->
            <div class="forgot-password">
                <a onclick="resetPassword()">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-signin" id="signinBtn"><i class="fas fa-arrow-right"></i> Sign In</button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA1PUbGQSYXh41L4_NVX6_X57LDNlaAF4g",
            authDomain: "aceed-tutoring.firebaseapp.com",
            projectId: "aceed-tutoring",
            storageBucket: "aceed-tutoring.firebasestorage.app",
            messagingSenderId: "225577605291",
            appId: "1:225577605291:web:75327bc4e1f644cef47fee"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // ============================================================
        // RESET PASSWORD FUNCTION
        // ============================================================
        function resetPassword() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                alert('Please enter your email address first.');
                return;
            }
            
            auth.sendPasswordResetEmail(email)
                .then(function() {
                    alert('✅ Password reset email sent! Please check your inbox (and spam folder).');
                })
                .catch(function(error) {
                    console.error('Reset password error:', error);
                    alert('❌ Error: ' + error.message);
                });
        }
        
        // ============================================================
        // SIGN IN FORM SUBMISSION
        // ============================================================
        const form = document.getElementById('signinForm');
        const errorDiv = document.getElementById('errorMessage');
        const signinBtn = document.getElementById('signinBtn');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            errorDiv.style.display = 'none';
            signinBtn.disabled = true;
            signinBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check user role
                const doc = await firebase.firestore().collection('users').doc(user.uid).get();
                const userData = doc.data();
                const role = userData.role;
                
                // Redirect based on role
                if (role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (role === 'tutor' || role === 'pending_tutor') {
                    window.location.href = 'tutor-dashboard.html';
                } else if (role === 'parent') {
                    window.location.href = 'parent-dashboard.html';
                } else {
                    window.location.href = 'member-dashboard.html';
                }
            } catch (error) {
                console.error('Signin error:', error);
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
                signinBtn.disabled = false;
                signinBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
            }
        });
    </script>
</body>
</html>

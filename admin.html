<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18209594553"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'AW-18209594553');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AceEd Tutoring</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #1e2a3a, #2c3e50);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        
        .logo-image {
            max-width: 250px;
            margin: 0 auto;
        }
        .logo-image img {
            width: 100%;
            max-height: 80px;
            object-fit: contain;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        
        /* Admin Header */
        .admin-header {
            background: linear-gradient(135deg, #8e44ad, #6c3483);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin: 20px 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .admin-header h1 {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-header h1 i {
            color: #f1c40f;
        }
        .admin-header .user-info {
            font-size: 1rem;
            opacity: 0.9;
        }
        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .stat-card .label {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .stat-card.pending .icon { color: #f39c12; }
        .stat-card.approved .icon { color: #27ae60; }
        .stat-card.rejected .icon { color: #e74c3c; }
        .stat-card.total .icon { color: #3498db; }
        
        /* Table */
        .table-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .table-section h2 {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .table-section h2 .filter-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .table-section h2 .filter-btns button {
            background: #ecf0f1;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .table-section h2 .filter-btns button:hover {
            background: #3498db;
            color: white;
        }
        .table-section h2 .filter-btns button.active {
            background: #3498db;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 15px;
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #e0e0e0;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        td .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        td .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        td .status.approved {
            background: #d4edda;
            color: #155724;
        }
        td .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .btn-sm {
            padding: 5px 12px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
            margin: 2px;
        }
        .btn-sm.approve {
            background: #27ae60;
            color: white;
        }
        .btn-sm.approve:hover {
            background: #1e8449;
        }
        .btn-sm.reject {
            background: #e74c3c;
            color: white;
        }
        .btn-sm.reject:hover {
            background: #c0392b;
        }
        .btn-sm.view {
            background: #3498db;
            color: white;
        }
        .btn-sm.view:hover {
            background: #2471a3;
        }
        .btn-sm.delete {
            background: #e74c3c;
            color: white;
        }
        .btn-sm.delete:hover {
            background: #c0392b;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-close:hover {
            color: #e74c3c;
        }
        .modal-content h2 {
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .modal-content .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .modal-content .detail-row .label {
            font-weight: 600;
            width: 150px;
            flex-shrink: 0;
            color: #555;
        }
        .modal-content .detail-row .value {
            color: #1e2a3a;
        }
        .modal-content .doc-link {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-decoration: none;
            margin: 2px;
        }
        .modal-content .doc-link:hover {
            background: #2471a3;
        }
        
        .no-applications {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .table-section {
                overflow-x: auto;
            }
            .modal-content {
                padding: 20px;
            }
            .modal-content .detail-row {
                flex-direction: column;
            }
            .modal-content .detail-row .label {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo-image">
                <img src="logo.png" alt="AceEd Tutoring Logo" onerror="this.src='https://via.placeholder.com/250x80?text=AceEd'">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="member-dashboard.html" class="nav-link">Dashboard</a>
                <a href="admin.html" class="nav-link" style="background-color: #8e44ad; border-radius: 40px;">Admin</a>
            </div>
        </div>
    </header>

    <div class="container" id="adminContent" style="display:none;">
        <!-- Admin Header -->
        <div class="admin-header">
            <div>
                <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
                <div class="user-info">
                    <i class="fas fa-user"></i> Welcome, <span id="adminName">Admin</span>
                </div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="icon"><i class="fas fa-users"></i></div>
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Applications</div>
            </div>
            <div class="stat-card pending">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <div class="number" id="pendingCount">0</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-card approved">
                <div class="icon"><i class="fas fa-check-circle"></i></div>
                <div class="number" id="approvedCount">0</div>
                <div class="label">Approved</div>
            </div>
            <div class="stat-card rejected">
                <div class="icon"><i class="fas fa-times-circle"></i></div>
                <div class="number" id="rejectedCount">0</div>
                <div class="label">Rejected</div>
            </div>
        </div>

        <!-- Applications Table -->
        <div class="table-section">
            <h2>
                <span><i class="fas fa-file-alt"></i> Tutor Applications</span>
                <div class="filter-btns">
                    <button class="active" data-filter="all" onclick="filterApplications('all')">All</button>
                    <button data-filter="pending" onclick="filterApplications('pending')">Pending</button>
                    <button data-filter="approved" onclick="filterApplications('approved')">Approved</button>
                    <button data-filter="rejected" onclick="filterApplications('rejected')">Rejected</button>
                </div>
            </h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Subjects</th>
                            <th>Status</th>
                            <th>Applied</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsBody">
                        <tr><td colspan="6" style="text-align:center; padding:30px; color:#7f8c8d;">Loading applications...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">Application Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ============================================================
        // ADMIN AUTH CHECK (Using Firestore)
        // ============================================================
        firebase.auth().onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'signin.html?redirect=admin.html';
                return;
            }

            // Check if user is admin
            try {
                const doc = await firebase.firestore().collection('admins').doc('admin').get();
                const isAdmin = doc.exists && doc.data().email === user.email;

                if (isAdmin) {
                    document.getElementById('adminContent').style.display = 'block';
                    document.getElementById('adminName').textContent = user.displayName || user.email || 'Admin';
                    loadApplications();
                } else {
                    // Not admin — redirect to dashboard
                    window.location.href = 'member-dashboard.html';
                }
            } catch (error) {
                console.error('Admin check error:', error);
                window.location.href = 'member-dashboard.html';
            }
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        function handleLogout() {
            firebase.auth().signOut().then(function() {
                window.location.href = 'index.html';
            });
        }

        // ============================================================
        // LOAD APPLICATIONS
        // ============================================================
        let allApplications = [];
        let currentFilter = 'all';

        function loadApplications() {
            const db = firebase.firestore();
            db.collection('tutor_applications')
                .orderBy('createdAt', 'desc')
                .get()
                .then(function(snapshot) {
                    allApplications = [];
                    snapshot.forEach(function(doc) {
                        allApplications.push({ id: doc.id, ...doc.data() });
                    });
                    updateStats();
                    renderTable(currentFilter);
                })
                .catch(function(error) {
                    console.error('Error loading applications:', error);
                    document.getElementById('applicationsBody').innerHTML = `
                        <tr><td colspan="6" style="text-align:center; padding:30px; color:#e74c3c;">Error loading applications</td></tr>
                    `;
                });
        }

        // ============================================================
        // UPDATE STATS
        // ============================================================
        function updateStats() {
            const total = allApplications.length;
            const pending = allApplications.filter(a => a.status === 'pending').length;
            const approved = allApplications.filter(a => a.status === 'approved').length;
            const rejected = allApplications.filter(a => a.status === 'rejected').length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('approvedCount').textContent = approved;
            document.getElementById('rejectedCount').textContent = rejected;
        }

        // ============================================================
        // RENDER TABLE
        // ============================================================
        function renderTable(filter) {
            currentFilter = filter;
            const filtered = filter === 'all' ? allApplications : allApplications.filter(a => a.status === filter);
            const tbody = document.getElementById('applicationsBody');

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6" style="text-align:center; padding:30px; color:#7f8c8d;">
                        <i class="fas fa-inbox"></i> No ${filter !== 'all' ? filter : ''} applications found
                    </td></tr>
                `;
                return;
            }

            let html = '';
            filtered.forEach(function(app) {
                const statusClass = app.status || 'pending';
                const statusLabel = app.status ? app.status.charAt(0).toUpperCase() + app.status.slice(1) : 'Pending';
                const subjects = app.subjects ? app.subjects.slice(0, 2).join(', ') + (app.subjects.length > 2 ? ' +' + (app.subjects.length - 2) : '') : 'N/A';
                const date = app.createdAt ? new Date(app.createdAt).toLocaleDateString() : 'N/A';

                html += `
                    <tr>
                        <td><strong>${app.fullName || 'N/A'}</strong></td>
                        <td>${app.email || 'N/A'}</td>
                        <td>${subjects}</td>
                        <td><span class="status ${statusClass}">${statusLabel}</span></td>
                        <td>${date}</td>
                        <td>
                            <button class="btn-sm view" onclick="viewApplication('${app.id}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${app.status === 'pending' ? `
                                <button class="btn-sm approve" onclick="updateStatus('${app.id}', 'approved')">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="btn-sm reject" onclick="updateStatus('${app.id}', 'rejected')">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                            <button class="btn-sm delete" onclick="deleteApplication('${app.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ============================================================
        // FILTER APPLICATIONS
        // ============================================================
        function filterApplications(filter) {
            document.querySelectorAll('.filter-btns button').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderTable(filter);
        }

        // ============================================================
        // VIEW APPLICATION (Modal)
        // ============================================================
        function viewApplication(id) {
            const app = allApplications.find(a => a.id === id);
            if (!app) return;

            const modal = document.getElementById('viewModal');
            const body = document.getElementById('modalBody');

            document.getElementById('modalTitle').textContent = 'Application: ' + (app.fullName || 'N/A');

            let docLinks = '';
            if (app.documents) {
                for (const [key, url] of Object.entries(app.documents)) {
                    const label = key.replace('Doc', '').replace(/([A-Z])/g, ' $1').trim();
                    docLinks += `<a href="${url}" target="_blank" class="doc-link"><i class="fas fa-file"></i> ${label}</a> `;
                }
            }

            let availabilityHtml = '';
            if (app.availability) {
                const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
                availabilityHtml = days.map(day => {
                    const d = app.availability[day];
                    if (d && d.available) {
                        return `<span style="background:#eef2fc; padding:2px 10px; border-radius:12px; font-size:0.8rem; margin:2px; display:inline-block;">
                            ${day.charAt(0).toUpperCase() + day.slice(1)}: ${d.startTime || 'N/A'} (${d.hours || 0}h)
                        </span>`;
                    }
                    return `<span style="background:#f0f0f0; padding:2px 10px; border-radius:12px; font-size:0.8rem; margin:2px; display:inline-block; color:#999;">
                        ${day.charAt(0).toUpperCase() + day.slice(1)}: Unavailable
                    </span>`;
                }).join(' ');
            }

            body.innerHTML = `
                <div class="detail-row"><span class="label">Full Name</span><span class="value">${app.fullName || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Email</span><span class="value">${app.email || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Phone</span><span class="value">${app.phone || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Location</span><span class="value">${app.location || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">University</span><span class="value">${app.university || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Degree</span><span class="value">${app.degree || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Year of Study</span><span class="value">${app.yearOfStudy || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Matric Average</span><span class="value">${app.matricAverage || 'Teaching Graduate'}</span></div>
                <div class="detail-row"><span class="label">Subjects</span><span class="value">${app.subjects ? app.subjects.join(', ') : 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Grades</span><span class="value">${app.grades ? app.grades.join(', ') : 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Availability</span><span class="value">${availabilityHtml || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Status</span><span class="value"><span class="status ${app.status || 'pending'}">${app.status ? app.status.charAt(0).toUpperCase() + app.status.slice(1) : 'Pending'}</span></span></div>
                <div class="detail-row"><span class="label">Documents</span><span class="value">${docLinks || 'No documents'}</span></div>
                <div class="detail-row"><span class="label">Applied On</span><span class="value">${app.createdAt ? new Date(app.createdAt).toLocaleString() : 'N/A'}</span></div>
            `;

            modal.classList.add('show');
        }

        // ============================================================
        // CLOSE MODAL
        // ============================================================
        function closeModal() {
            document.getElementById('viewModal').classList.remove('show');
        }

        // ============================================================
        // UPDATE STATUS (Approve / Reject) - WITH ROLE CHANGE!
        // ============================================================
        function updateStatus(id, newStatus) {
            if (!confirm(`Are you sure you want to ${newStatus} this application?`)) return;

            const db = firebase.firestore();
            
            // 1. Update the application status
            db.collection('tutor_applications').doc(id).update({
                status: newStatus,
                updatedAt: new Date().toISOString()
            })
            .then(function() {
                // 2. Update the user's role in the users collection
                const newRole = newStatus === 'approved' ? 'tutor' : 'rejected_tutor';
                return db.collection('users').doc(id).update({
                    role: newRole,
                    status: newStatus,
                    updatedAt: new Date().toISOString()
                });
            })
            .then(function() {
                alert('Application ' + newStatus + ' successfully!');
                loadApplications();
            })
            .catch(function(error) {
                alert('Error: ' + error.message);
            });
        }

        // ============================================================
        // DELETE APPLICATION
        // ============================================================
        function deleteApplication(id) {
            if (!confirm('Are you sure you want to delete this application? This cannot be undone.')) return;

            const db = firebase.firestore();
            db.collection('tutor_applications').doc(id).delete()
            .then(function() {
                alert('Application deleted successfully!');
                loadApplications();
            })
            .catch(function(error) {
                alert('Error: ' + error.message);
            });
        }
    </script>
</body>
</html>

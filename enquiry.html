    <style>
        :root {
            --bg-color: #f7f9fc;
            --white: #ffffff;
            --text-main: #1e2a3e;
            --text-muted: #64748b;
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        a { text-decoration: none; color: var(--primary); }
        
        /* Header */
        .site-header {
            background: white; border-bottom: 1px solid var(--border); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand img { height: 45px; width: auto; }
        .nav-links a { margin-left: 20px; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; }
        .nav-links a:hover { color: var(--primary); }

        /* Layout */
        .container { max-width: 700px; margin: 60px auto; padding: 0 20px; }
        
        .form-card { 
            background: white; border: 1px solid var(--border); border-radius: var(--radius); 
            padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h1 { font-size: 2rem; color: var(--text-main); margin-bottom: 10px; }
        .form-header p { color: var(--text-muted); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border); 
            border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .btn-submit {
            width: 100%; background: var(--primary); color: white; border: none; 
            padding: 16px; border-radius: 8px; font-size: 1.05rem; font-weight: 600; 
            cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Success State */
        .success-state { display: none; text-align: center; padding: 40px 0; }
        .success-state i { font-size: 4rem; color: #27ae60; margin-bottom: 20px; }
        .success-state h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--text-main); }
        .success-state p { color: var(--text-muted); margin-bottom: 25px; }
        .btn-back { display: inline-block; background: var(--bg-color); color: var(--text-main); padding: 12px 30px; border-radius: 8px; font-weight: 600; border: 1px solid var(--border); }
        .btn-back:hover { background: white; }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .form-card { padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <a href="index.html" class="brand">
            <img src="logo.png" alt="AceEd Tutoring">
        </a>
        <div class="nav-links">
            <a href="index.html">Back to Home</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="form-card" id="formCard">
            
            <div id="formContent">
                <div class="form-header">
                    <h1>Make an Enquiry</h1>
                    <p>Fill in the form below and our team will get back to you within 24 hours.</p>
                </div>

                <div id="errorBox" style="display: none; background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;"></div>

                <form id="enquiryForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Parent / Guardian Full Name *</label>
                            <input type="text" id="parentName" required placeholder="e.g. Jane Doe">
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" id="phone" required placeholder="e.g. 068 651 7080">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" id="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label>Child's Grade *</label>
                        <select id="grade" required>
                            <option value="">Select Grade</option>
                            <option value="Grade 6">Grade 6</option>
                            <option value="Grade 7">Grade 7</option>
                            <option value="Grade 8">Grade 8</option>
                            <option value="Grade 9">Grade 9</option>
                            <option value="Grade 10">Grade 10</option>
                            <option value="Grade 11">Grade 11</option>
                            <option value="Grade 12">Grade 12</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Message / What do you need help with? *</label>
                        <textarea id="message" required placeholder="Tell us which subjects you need help with, or if you are looking for a long-term tutor..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Send Enquiry</button>
                </form>
            </div>

            <!-- SUCCESS STATE -->
            <div class="success-state" id="successState">
                <i class="fas fa-check-circle"></i>
                <h2>Enquiry Sent Successfully!</h2>
                <p>Thank you for reaching out. We have received your message and our team will contact you shortly.</p>
                <a href="index.html" class="btn-back">Return to Home</a>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('enquiryForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            submitBtn.disabled = true;
            errorBox.style.display = 'none';

            const parentName = document.getElementById('parentName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const grade = document.getElementById('grade').value;
            const message = document.getElementById('message').value.trim();

            try {
                const db = firebase.firestore();
                
                // 1. Save to 'enquiries' collection in Firebase
                await db.collection('enquiries').add({
                    parentName: parentName,
                    phone: phone,
                    email: email,
                    grade: grade,
                    message: message,
                    status: 'new',
                    createdAt: new Date().toISOString()
                });

                // 2. Send email to Admin
                await db.collection('mail').add({
                    to: 'admin@aceed.co.za',
                    message: {
                        subject: 'New Enquiry: ' + parentName,
                        html: `
                            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                                <div style="background: #1e2a3a; color: white; padding: 20px; text-align: center;">
                                    <h1 style="margin: 0;">AceEd Tutoring</h1>
                                    <p style="color: #f39c12; margin: 5px 0 0;">✦ New Website Enquiry ✦</p>
                                </div>
                                <div style="padding: 25px; background: #f9f9f9;">
                                    <h2>New Enquiry Received</h2>
                                    <p><strong>Parent Name:</strong> ${parentName}</p>
                                    <p><strong>Email:</strong> ${email}</p>
                                    <p><strong>Phone:</strong> ${phone}</p>
                                    <p><strong>Child's Grade:</strong> ${grade}</p>
                                    <hr>
                                    <p><strong>Message:</strong></p>
                                    <p style="background: white; padding: 15px; border-radius: 8px;">${message}</p>
                                    <hr>
                                    <p><a href="https://aceed.co.za/admin.html" style="background: #3498db; color: white; padding: 12px 30px; text-decoration: none; border-radius: 30px;">View in Admin Dashboard</a></p>
                                </div>
                            </div>
                        `
                    }
                });

                // 3. Show success state
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('successState').style.display = 'block';

            } catch (error) {
                console.error('Error sending enquiry:', error);
                errorBox.textContent = 'There was an error sending your message. Please try again or email info@aceed.co.za directly.';
                errorBox.style.display = 'block';
                submitBtn.innerHTML = 'Send Enquiry';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            color: #1e2a3a;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .page-header .subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-secondary { background: #ecf0f1; color: #1e2a3a; }
        .btn-secondary:hover { background: #d5dbdb; }
        .btn-green { background: #27ae60; color: white; }
        .btn-green:hover { background: #1e8449; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e2a3a, #2c3e50);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f39c12;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card.positive .stat-value { color: #27ae60; }
        .stat-card.negative .stat-value { color: #e74c3c; }

        /* Chart */
        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }

        /* Weekly Logs */
        .log-entry {
            border-left: 4px solid #3498db;
            padding: 18px 20px;
            margin-bottom: 12px;
            background: #f9f9f9;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .log-entry:hover {
            background: #f0f8ff;
            transform: translateX(3px);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .log-week {
            font-weight: 700;
            color: #1e2a3a;
            font-size: 1rem;
        }

        .log-meta {
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .log-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-assessment { background: #fff3cd; color: #856404; }
        .badge-test { background: #d4edda; color: #155724; }

        .log-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .log-entry.open .log-details { display: block; }

        .session-item {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-left: 3px solid #3498db;
        }

        .session-item .s-when {
            font-weight: 700;
            color: #3498db;
            font-size: 0.85rem;
        }

        .session-item .s-topics {
            color: #555;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .notes-box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
        }

        .notes-box strong {
            color: #1e2a3a;
            display: block;
            margin-bottom: 5px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #1e2a3a;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #7f8c8d;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Loading */
        .loading-screen {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        .loading-screen .spinner {
            font-size: 3rem;
            color: #f39c12;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .access-denied {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        .access-denied i {
            font-size: 4rem;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .access-denied h2 { color: #721c24; margin-bottom: 10px; }
        .access-denied p { color: #7f8c8d; margin-bottom: 20px; }

        /* Print */
        @media print {
            body { background: white; padding: 0; }
            .card { box-shadow: none; border-radius: 0; padding: 20px; }
            .no-print { display: none !important; }
            .log-details { display: block !important; }
            .log-entry { background: white; border-left-width: 3px; }
            .log-entry { page-break-inside: avoid; }
        }

        @media (max-width: 600px) {
            .container { padding: 0; }
            .card { padding: 20px; }
            .page-header h1 { font-size: 1.4rem; }
            .chart-container { height: 280px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingScreen" class="loading-screen">
            <i class="fas fa-spinner spinner"></i>
            <p style="margin-top: 15px; color: #7f8c8d;">Loading progress report...</p>
        </div>

        <div id="mainContent" style="display: none;"></div>

        <div id="accessDenied" class="access-denied" style="display: none;">
            <i class="fas fa-lock"></i>
            <h2>Access Denied</h2>
            <p>You don't have permission to view this progress report.</p>
            <a href="javascript:history.back()" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>

    <script>
        // ============================================================
        // PARAMS
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const studentUid = params.get('student');
        const subject = params.get('subject');

        let chartInstance = null;

        // ============================================================
        // AUTH + LOAD
        // ============================================================
        firebase.auth().onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'signin.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            if (!studentUid || !subject) {
                showError('Missing student or subject in URL.');
                return;
            }

            try {
                // Get role
                const userDoc = await firebase.firestore().collection('users').doc(user.uid).get();
                const userData = userDoc.data() || {};
                let role = userData.role || 'student';

                // Admin check
                if (role === 'admin') {
                    const adminDoc = await firebase.firestore().collection('admins').doc('admin').get();
                    const isAdmin = adminDoc.exists && adminDoc.data().email === user.email;
                    if (!isAdmin) role = 'parent';
                }

                await loadReport(user, role, userData);

            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            }
        });

        // ============================================================
        // LOAD REPORT
        // ============================================================
        async function loadReport(user, role, userData) {
            const db = firebase.firestore();

            // Load all weekly logs for this student + subject
            const snapshot = await db.collection('weekly_logs')
                .where('studentUid', '==', studentUid)
                .where('subject', '==', subject)
                .get();

            const logs = [];
            snapshot.forEach(function(doc) {
                logs.push({ id: doc.id, ...doc.data() });
            });

            if (logs.length === 0) {
                showEmpty();
                return;
            }

            // ---- Access Control ----
            const sample = logs[0];

            if (role === 'parent') {
                if (sample.parentUid !== user.uid) {
                    showAccessDenied();
                    return;
                }
            } else if (role === 'tutor') {
                if (sample.tutorUid !== user.uid) {
                    showAccessDenied();
                    return;
                }
            }
            // admin — allowed

            // ---- Sort by week ----
            logs.sort((a, b) => (a.weekOf || '').localeCompare(b.weekOf || ''));

            renderReport(logs, sample);
        }

        // ============================================================
        // RENDER REPORT
        // ============================================================
        function renderReport(logs, sample) {
            // Calculate stats
            let totalSessions = 0;
            let totalHours = 0;

            const tutorData = [];      // {week, mark}
            const testData = [];       // {week, mark, name, date}
            let startingMark = null;

            logs.forEach(function(log) {
                totalSessions += log.sessionCount || 0;
                totalHours += log.totalHours || 0;

                const weekLabel = formatWeekShort(log.weekOf);

                if (log.tutorAssessment != null) {
                    tutorData.push({ week: weekLabel, mark: log.tutorAssessment, weekOf: log.weekOf });
                }

                if (log.schoolTest && log.schoolTest.mark != null && log.schoolTest.total) {
                    const pct = Math.round(log.schoolTest.mark / log.schoolTest.total * 100);
                    testData.push({ week: weekLabel, mark: pct, name: log.schoolTest.name, date: log.schoolTest.date, weekOf: log.weekOf });
                }
            });

            // Starting mark: first school test, else first tutor assessment
            if (testData.length > 0) {
                startingMark = testData[0].mark;
            } else if (tutorData.length > 0) {
                startingMark = tutorData[0].mark;
            }

            // Current mark: latest of either (prefer school test if same week)
            let currentMark = null;
            if (testData.length > 0) {
                currentMark = testData[testData.length - 1].mark;
            } else if (tutorData.length > 0) {
                currentMark = tutorData[tutorData.length - 1].mark;
            }

            const change = (startingMark != null && currentMark != null) ? (currentMark - startingMark) : null;
            const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : '';

            // Build HTML
            const html = `
                <div class="card">
                    <div class="page-header">
                        <div>
                            <h1>${escapeHtml(sample.studentName)} — ${escapeHtml(subject)}</h1>
                            <div class="subtitle">
                                Grade ${escapeHtml(sample.grade || 'N/A')} · Tutor: ${escapeHtml(sample.tutorName || 'N/A')}
                            </div>
                        </div>
                        <div class="header-actions no-print">
                            <a href="javascript:history.back()" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Back
                            </a>
                            <button class="btn btn-primary" onclick="window.print()">
                                <i class="fas fa-file-pdf"></i> Print / Save as PDF
                            </button>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${startingMark != null ? startingMark + '%' : 'N/A'}</div>
                            <div class="stat-label">Starting Mark</div>
                        </div>
                        <div class="stat-card ${changeClass}">
                            <div class="stat-value">${currentMark != null ? currentMark + '%' : 'N/A'}</div>
                            <div class="stat-label">Current Mark</div>
                        </div>
                        <div class="stat-card ${changeClass}">
                            <div class="stat-value">${change != null ? (change > 0 ? '+' : '') + change + '%' : 'N/A'}</div>
                            <div class="stat-label">Change</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${totalSessions}</div>
                            <div class="stat-label">Total Sessions</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${totalHours}</div>
                            <div class="stat-label">Total Hours</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${logs.length}</div>
                            <div class="stat-label">Weeks Logged</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 style="color: #1e2a3a; margin-bottom: 10px; font-size: 1.2rem;">
                        <i class="fas fa-chart-line" style="color: #f39c12;"></i> Mark Progression
                    </h2>
                    <div class="chart-container">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <h2 style="color: #1e2a3a; margin-bottom: 15px; font-size: 1.2rem;">
                        <i class="fas fa-book-open" style="color: #f39c12;"></i> Weekly Logs
                    </h2>
                    <div id="logsContainer">${buildLogsHtml(logs)}</div>
                </div>
            `;

            const main = document.getElementById('mainContent');
            main.innerHTML = html;
            main.style.display = 'block';
            document.getElementById('loadingScreen').style.display = 'none';

            // Draw chart after render
            drawChart(tutorData, testData);
        }

        // ============================================================
        // BUILD WEEKLY LOG ENTRIES
        // ============================================================
        function buildLogsHtml(logs) {
            // Reverse — newest first
            const reversed = logs.slice().reverse();

            return reversed.map(function(log) {
                const weekLabel = formatWeekFull(log.weekOf);
                const sessionsHtml = (log.sessions || []).map(function(s) {
                    const d = new Date(s.date + 'T00:00:00');
                    const dateStr = d.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short' });
                    return `
                        <div class="session-item">
                            <div class="s-when">${dateStr} — ${s.time} (${s.duration} hr)</div>
                            <div class="s-topics">${escapeHtml(s.topics || '')}</div>
                        </div>
                    `;
                }).join('');

                let testHtml = '';
                if (log.schoolTest && log.schoolTest.name) {
                    const pct = log.schoolTest.total ? Math.round(log.schoolTest.mark / log.schoolTest.total * 100) : null;
                    testHtml = `
                        <div class="badge badge-test">
                            📄 ${escapeHtml(log.schoolTest.name)}: ${log.schoolTest.mark}/${log.schoolTest.total}${pct != null ? ' (' + pct + '%)' : ''}
                        </div>
                    `;
                }

                return `
                    <div class="log-entry" onclick="toggleLog(this)">
                        <div class="log-header">
                            <div class="log-week">${weekLabel}</div>
                            <div class="log-meta">${log.sessionCount} session${log.sessionCount > 1 ? 's' : ''} · ${log.totalHours} hrs</div>
                        </div>
                        <div class="log-badges">
                            <div class="badge badge-assessment">🎯 Assessment: ${log.tutorAssessment}%</div>
                            ${testHtml}
                        </div>

                        <div class="log-details">
                            <h4 style="color: #1e2a3a; margin-bottom: 10px; font-size: 0.95rem;">Sessions</h4>
                            ${sessionsHtml}
                            <div class="notes-box">
                                <strong>Weekly Notes:</strong>
                                ${escapeHtml(log.weeklyNotes || 'No notes')}
                            </div>
                            ${buildTestDetails(log)}
                        </div>
                        
                    </div>
                `;
            }).join('');
        }

        function buildTestDetails(log) {
            const test = log.schoolTest;
            if (!test || !test.name) return '';
        
            const pct = test.total ? Math.round(test.mark / test.total * 100) : null;
            const dateStr = test.date
                ? new Date(test.date + 'T00:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' })
                : '';
        
            const paperHtml = test.paper
                ? `<a href="${test.paper.url}" target="_blank" rel="noopener"
                      style="display: inline-flex; align-items: center; gap: 8px; background: #3498db; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-top: 10px;">
                      <i class="fas fa-file-download"></i> View Test Paper
                   </a>`
                : `<div style="color: #95a5a6; font-size: 0.85rem; margin-top: 10px; font-style: italic;">No paper uploaded</div>`;
        
            return `
                <div style="background: white; border-radius: 10px; padding: 15px; margin-top: 10px; border-left: 4px solid #27ae60;">
                    <div style="color: #7f8c8d; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 8px;">
                        School Test
                    </div>
                    <div style="font-weight: 700; color: #1e2a3a; margin-bottom: 5px;">
                        ${escapeHtml(test.name)}${dateStr ? ' — ' + dateStr : ''}
                    </div>
                    <div style="font-size: 1.3rem; color: #27ae60; font-weight: 700;">
                        ${test.mark} / ${test.total}${pct != null ? ' (' + pct + '%)' : ''}
                    </div>
                    ${paperHtml}
                </div>
            `;
        }
        

        function toggleLog(el) {
            el.classList.toggle('open');
        }

        // ============================================================
        // DRAW CHART
        // ============================================================
        function drawChart(tutorData, testData) {
            const ctx = document.getElementById('progressChart').getContext('2d');

            // Merge weeks into one timeline for the x-axis
            const allWeeks = new Set();
            tutorData.forEach(t => allWeeks.add(t.week));
            testData.forEach(t => allWeeks.add(t.week));
            const weeks = Array.from(allWeeks);

            // Map data to that timeline (null for missing weeks)
            const tutorLine = weeks.map(w => {
                const found = tutorData.find(t => t.week === w);
                return found ? found.mark : null;
            });
            const testLine = weeks.map(w => {
                const found = testData.find(t => t.week === w);
                return found ? found.mark : null;
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: weeks,
                    datasets: [
                        {
                            label: 'Tutor Assessment',
                            data: tutorLine,
                            borderColor: '#f39c12',
                            backgroundColor: 'rgba(243, 156, 18, 0.1)',
                            tension: 0.3,
                            spanGaps: true,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            pointBackgroundColor: '#f39c12',
                            borderWidth: 3
                        },
                        {
                            label: 'School Test',
                            data: testLine,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            tension: 0.3,
                            spanGaps: true,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            pointBackgroundColor: '#3498db',
                            borderWidth: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: { size: 13, weight: '600' },
                                usePointStyle: true,
                                padding: 15
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1e2a3a',
                            padding: 12,
                            titleFont: { size: 13, weight: '700' },
                            bodyFont: { size: 12 },
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) { return value + '%'; },
                                color: '#7f8c8d'
                            },
                            grid: { color: '#f0f0f0' }
                        },
                        x: {
                            ticks: { color: '#7f8c8d' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function formatWeekShort(weekOf) {
            if (!weekOf) return '';
            const d = new Date(weekOf + 'T00:00:00');
            return d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
        }

        function formatWeekFull(weekOf) {
            if (!weekOf) return '';
            const start = new Date(weekOf + 'T00:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            return 'Week of ' + start.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' })
                + ' - ' + end.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ============================================================
        // EMPTY / ERROR / ACCESS DENIED
        // ============================================================
        function showEmpty() {
            document.getElementById('loadingScreen').style.display = 'none';
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="card empty-state">
                    <i class="fas fa-chart-line"></i>
                    <h2>No Progress Data Yet</h2>
                    <p>No sessions have been logged for this student in <strong>${escapeHtml(subject)}</strong> yet.<br>Your tutor will log sessions soon.</p>
                    <a href="javascript:history.back()" class="btn btn-primary" style="margin-top: 20px;">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            `;
            main.style.display = 'block';
        }

        function showAccessDenied() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('accessDenied').style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="card" style="text-align: center; padding: 60px 20px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: #e74c3c; margin-bottom: 20px;"></i>
                    <h2 style="color: #e74c3c; margin-bottom: 10px;">Something went wrong</h2>
                    <p style="color: #7f8c8d;">${escapeHtml(message)}</p>
                    <a href="javascript:history.back()" class="btn btn-primary" style="margin-top: 20px;">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            `;
            main.style.display = 'block';
        }
    </script>
</body>
</html>

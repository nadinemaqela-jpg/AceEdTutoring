    <style>
        :root {
            --bg-color: #f7f9fc;
            --white: #ffffff;
            --text-main: #1e2a3e;
            --text-muted: #64748b;
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --border: #e2e8f0;
            --radius: 12px;
            --wrap: 900px;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 30px 20px; }
        a { text-decoration: none; color: var(--primary); }
        
        .wrap { max-width: var(--wrap); margin: 0 auto; }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.95rem;
            transition: all 0.2s; border: none; cursor: pointer; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: white; color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-color); }

        /* CARDS */
        .card {
            background: white; border-radius: var(--radius); padding: 30px;
            margin-bottom: 24px; border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        /* PAGE HEADER */
        .page-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 20px; flex-wrap: wrap;
        }
        .page-header h1 { font-size: 1.8rem; letter-spacing: -0.02em; margin-bottom: 4px; color: var(--text-main); }
        .page-header .subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* STATS GRID */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px; margin-top: 25px;
        }
        .stat-card {
            background: var(--bg-color); border: 1px solid var(--border);
            border-radius: 8px; padding: 20px; text-align: center;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .stat-card .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; color: var(--text-muted); }
        
        .stat-card.positive .stat-value { color: var(--success); }
        .stat-card.negative .stat-value { color: var(--danger); }

        /* CHART */
        .chart-container { position: relative; height: 350px; margin-top: 20px; }

        /* WEEKLY LOGS */
        .log-entry {
            border-left: 4px solid var(--primary);
            padding: 20px; margin-bottom: 15px;
            background: var(--bg-color); border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .log-entry:hover { border-color: var(--primary-hover); background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        .log-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .log-week { font-weight: 600; color: var(--text-main); font-size: 1rem; }
        .log-meta { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        
        .log-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .badge-assessment { background: #fff3cd; color: #856404; }
        .badge-test { background: #d4edda; color: #155724; }

        .log-details { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .log-entry.open .log-details { display: block; }

        .session-item {
            background: white; border-radius: 8px; padding: 15px; margin-bottom: 10px;
            border: 1px solid var(--border); border-left: 3px solid var(--primary);
        }
        .session-item .s-when { font-weight: 600; color: var(--primary); font-size: 0.85rem; margin-bottom: 4px; }
        .session-item .s-topics { color: var(--text-main); font-size: 0.9rem; }

        .notes-box {
            background: white; border-radius: 8px; padding: 15px; margin-top: 15px;
            font-size: 0.9rem; color: var(--text-muted); border: 1px solid var(--border);
        }
        .notes-box strong { color: var(--text-main); display: block; margin-bottom: 5px; }

        /* TEST DETAILS */
        .test-box {
            background: white; border-radius: 8px; padding: 15px; margin-top: 10px;
            border: 1px solid var(--border); border-left: 4px solid var(--warning);
        }
        .test-box .test-header { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 8px; }
        .test-box .test-mark { font-size: 1.3rem; color: var(--warning); font-weight: 700; margin-bottom: 8px; }
        
        /* EMPTY / ERROR STATES */
        .empty-state, .access-denied, .loading-screen {
            text-align: center; padding: 60px 20px; background: white;
            border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .empty-state i, .access-denied i, .loading-screen .spinner { font-size: 3rem; margin-bottom: 15px; }
        .empty-state i { color: #cbd5e1; }
        .access-denied i { color: var(--danger); }
        .loading-screen .spinner { color: var(--primary); animation: spin 1s linear infinite; }
        
        .empty-state h2, .access-denied h2 { color: var(--text-main); margin-bottom: 10px; font-size: 1.4rem; }
        .empty-state p, .access-denied p { color: var(--text-muted); max-width: 400px; margin: 0 auto 20px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* PRINT STYLES */
        @media print {
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: none; padding: 0 0 20px 0; margin-bottom: 20px; border-bottom: 1px solid #eee; border-radius: 0; }
            .no-print { display: none !important; }
            .log-details { display: block !important; }
            .log-entry { background: white; border: 1px solid #ddd; page-break-inside: avoid; }
            .stat-card { background: white; border: 1px solid #ddd; }
            .session-item, .notes-box { border: 1px solid #ddd; }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .page-header { flex-direction: column; }
            .header-actions { width: 100%; flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .chart-container { height: 280px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- LOADING -->
        <div id="loadingScreen" class="loading-screen">
            <i class="fas fa-spinner spinner"></i>
            <p style="margin-top: 15px; color: var(--text-muted); font-weight: 500;">Loading progress report...</p>
        </div>

        <!-- MAIN CONTENT -->
        <div id="mainContent" style="display: none;"></div>

        <!-- ACCESS DENIED -->
        <div id="accessDenied" class="access-denied" style="display: none;">
            <i class="fas fa-lock"></i>
            <h2>Access Denied</h2>
            <p>You don't have permission to view this progress report.</p>
            <a href="javascript:history.back()" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>

    <script>
        // ============================================================
        // PARAMS
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const studentUid = params.get('student');
        const subject = params.get('subject');

        let chartInstance = null;

        // ============================================================
        // AUTH + LOAD
        // ============================================================
        firebase.auth().onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'signin.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            if (!studentUid || !subject) {
                showError('Missing student or subject in URL.');
                return;
            }

            try {
                const userDoc = await firebase.firestore().collection('users').doc(user.uid).get();
                const userData = userDoc.data() || {};
                let role = userData.role || 'student';

                if (role === 'admin') {
                    const adminDoc = await firebase.firestore().collection('admins').doc('admin').get();
                    const isAdmin = adminDoc.exists && adminDoc.data().email === user.email;
                    if (!isAdmin) role = 'parent';
                }

                await loadReport(user, role, userData);

            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            }
        });

        // ============================================================
        // LOAD REPORT
        // ============================================================
        async function loadReport(user, role, userData) {
            const db = firebase.firestore();

            const snapshot = await db.collection('weekly_logs')
                .where('studentUid', '==', studentUid)
                .where('subject', '==', subject)
                .get();

            const logs = [];
            snapshot.forEach(function(doc) {
                logs.push({ id: doc.id, ...doc.data() });
            });

            if (logs.length === 0) {
                showEmpty();
                return;
            }

            const sample = logs[0];

            if (role === 'parent') {
                if (sample.parentUid !== user.uid) {
                    showAccessDenied();
                    return;
                }
            } else if (role === 'tutor') {
                if (sample.tutorUid !== user.uid) {
                    showAccessDenied();
                    return;
                }
            }

            logs.sort((a, b) => (a.weekOf || '').localeCompare(b.weekOf || ''));
            renderReport(logs, sample);
        }

        // ============================================================
        // RENDER REPORT
        // ============================================================
        function renderReport(logs, sample) {
            let totalSessions = 0;
            let totalHours = 0;
            const tutorData = [];
            const testData = [];
            let startingMark = null;

            logs.forEach(function(log) {
                totalSessions += log.sessionCount || 0;
                totalHours += log.totalHours || 0;
                const weekLabel = formatWeekShort(log.weekOf);

                if (log.tutorAssessment != null) {
                    tutorData.push({ week: weekLabel, mark: log.tutorAssessment, weekOf: log.weekOf });
                }

                if (log.schoolTest && log.schoolTest.mark != null && log.schoolTest.total) {
                    const pct = Math.round(log.schoolTest.mark / log.schoolTest.total * 100);
                    testData.push({ week: weekLabel, mark: pct, name: log.schoolTest.name, date: log.schoolTest.date, weekOf: log.weekOf });
                }
            });

            if (testData.length > 0) { startingMark = testData[0].mark; }
            else if (tutorData.length > 0) { startingMark = tutorData[0].mark; }

            let currentMark = null;
            if (testData.length > 0) { currentMark = testData[testData.length - 1].mark; }
            else if (tutorData.length > 0) { currentMark = tutorData[tutorData.length - 1].mark; }

            const change = (startingMark != null && currentMark != null) ? (currentMark - startingMark) : null;
            const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : '';

            const html = `
                <div class="card">
                    <div class="page-header">
                        <div>
                            <h1>${escapeHtml(sample.studentName)} — ${escapeHtml(subject)}</h1>
                            <div class="subtitle">
                                Grade ${escapeHtml(sample.grade || 'N/A')} &nbsp;|&nbsp; Tutor: ${escapeHtml(sample.tutorName || 'N/A')}
                            </div>
                        </div>
                        <div class="header-actions no-print">
                            <a href="javascript:history.back()" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Back
                            </a>
                            <button class="btn btn-primary" onclick="window.print()">
                                <i class="fas fa-file-pdf"></i> Print / Save as PDF
                            </button>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${startingMark != null ? startingMark + '%' : 'N/A'}</div>
                            <div class="stat-label">Starting Mark</div>
                        </div>
                        <div class="stat-card ${changeClass}">
                            <div class="stat-value">${currentMark != null ? currentMark + '%' : 'N/A'}</div>
                            <div class="stat-label">Current Mark</div>
                        </div>
                        <div class="stat-card ${changeClass}">
                            <div class="stat-value">${change != null ? (change > 0 ? '+' : '') + change + '%' : 'N/A'}</div>
                            <div class="stat-label">Change</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${totalSessions}</div>
                            <div class="stat-label">Sessions</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${totalHours}</div>
                            <div class="stat-label">Hours</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${logs.length}</div>
                            <div class="stat-label">Weeks</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 style="color: var(--text-main); margin-bottom: 10px; font-size: 1.2rem; display:flex; align-items:center; gap:8px;">
                        <i class="fas fa-chart-line" style="color: var(--primary);"></i> Mark Progression
                    </h2>
                    <div class="chart-container">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <h2 style="color: var(--text-main); margin-bottom: 20px; font-size: 1.2rem; display:flex; align-items:center; gap:8px;">
                        <i class="fas fa-book-open" style="color: var(--primary);"></i> Weekly Logs
                    </h2>
                    <div id="logsContainer">${buildLogsHtml(logs)}</div>
                </div>
            `;

            const main = document.getElementById('mainContent');
            main.innerHTML = html;
            main.style.display = 'block';
            document.getElementById('loadingScreen').style.display = 'none';

            drawChart(tutorData, testData);
        }

        // ============================================================
        // BUILD WEEKLY LOG ENTRIES
        // ============================================================
        function buildLogsHtml(logs) {
            const reversed = logs.slice().reverse();

            return reversed.map(function(log) {
                const weekLabel = formatWeekFull(log.weekOf);
                const sessionsHtml = (log.sessions || []).map(function(s) {
                    const d = new Date(s.date + 'T00:00:00');
                    const dateStr = d.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short' });
                    return `
                        <div class="session-item">
                            <div class="s-when">${dateStr} — ${s.time} (${s.duration} hr)</div>
                            <div class="s-topics">${escapeHtml(s.topics || '')}</div>
                        </div>
                    `;
                }).join('');
                
                let testHtml = '';
                if (log.schoolTest && log.schoolTest.name) {
                    const pct = log.schoolTest.total ? Math.round(log.schoolTest.mark / log.schoolTest.total * 100) : null;
                    testHtml = `
                        <div class="badge badge-test">
                            <i class="fas fa-school"></i> School: ${escapeHtml(log.schoolTest.name)} — ${log.schoolTest.mark}/${log.schoolTest.total}${pct != null ? ' (' + pct + '%)' : ''}
                        </div>
                    `;
                }

                return `
                    <div class="log-entry" onclick="toggleLog(this)">
                        <div class="log-header">
                            <div class="log-week">${weekLabel}</div>
                            <div class="log-meta">${log.sessionCount} session${log.sessionCount > 1 ? 's' : ''} · ${log.totalHours} hrs</div>
                        </div>
                        <div class="log-badges">
                            <div class="badge badge-assessment"><i class="fas fa-bullseye"></i> Assessment: ${log.tutorAssessment}%</div>
                            ${testHtml}
                        </div>

                        <div class="log-details">
                            <h4 style="color: var(--text-main); margin-bottom: 12px; font-size: 0.95rem;">Sessions</h4>
                            ${sessionsHtml}
                            <div class="notes-box">
                                <strong>Weekly Notes:</strong>
                                ${escapeHtml(log.weeklyNotes || 'No notes')}
                            </div>
                            ${buildTestDetails(log)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function buildTestDetails(log) {
            let html = '';
        
            if (log.tutorTest && log.tutorTest.url) {
                html += `
                    <div class="test-box">
                        <div class="test-header">Tutor Test</div>
                        <div class="test-mark">${log.tutorAssessment}%</div>
                        <a href="${log.tutorTest.url}" target="_blank" rel="noopener" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem;">
                            <i class="fas fa-file-download"></i> View Test Paper
                        </a>
                    </div>
                `;
            }
        
            if (log.schoolTest && log.schoolTest.name) {
                const test = log.schoolTest;
                const pct = test.total ? Math.round(test.mark / test.total * 100) : null;
                const dateStr = test.date
                    ? new Date(test.date + 'T00:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' })
                    : '';
        
                html += `
                    <div class="test-box" style="border-left-color: var(--primary);">
                        <div class="test-header" style="color: var(--primary);">School Test</div>
                        <div style="font-weight: 600; color: var(--text-main); margin-bottom: 5px;">
                            ${escapeHtml(test.name)}${dateStr ? ' — ' + dateStr : ''}
                        </div>
                        <div class="test-mark" style="color: var(--primary);">
                            ${test.mark} / ${test.total}${pct != null ? ' (' + pct + '%)' : ''}
                        </div>
                    </div>
                `;
            }
        
            return html;
        }

        function toggleLog(el) {
            el.classList.toggle('open');
        }

        // ============================================================
        // DRAW CHART
        // ============================================================
        function drawChart(tutorData, testData) {
            const ctx = document.getElementById('progressChart').getContext('2d');

            const allWeeks = new Set();
            tutorData.forEach(t => allWeeks.add(t.week));
            testData.forEach(t => allWeeks.add(t.week));
            const weeks = Array.from(allWeeks);

            const tutorLine = weeks.map(w => {
                const found = tutorData.find(t => t.week === w);
                return found ? found.mark : null;
            });
            const testLine = weeks.map(w => {
                const found = testData.find(t => t.week === w);
                return found ? found.mark : null;
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: weeks,
                    datasets: [
                        {
                            label: 'Tutor Assessment',
                            data: tutorLine,
                            borderColor: '#f39c12',
                            backgroundColor: 'rgba(243, 156, 18, 0.1)',
                            tension: 0.3,
                            spanGaps: true,
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            pointBackgroundColor: '#f39c12',
                            borderWidth: 3
                        },
                        {
                            label: 'School Test',
                            data: testLine,
                            borderColor: '#1e3a8a',
                            backgroundColor: 'rgba(30, 58, 138, 0.1)',
                            tension: 0.3,
                            spanGaps: true,
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            pointBackgroundColor: '#1e3a8a',
                            borderWidth: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: { family: 'Inter', size: 12, weight: '600' },
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1e2a3a',
                            padding: 12,
                            titleFont: { family: 'Inter', size: 13, weight: '600' },
                            bodyFont: { family: 'Inter', size: 12 },
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) { return value + '%'; },
                                color: '#64748b',
                                font: { family: 'Inter' }
                            },
                            grid: { color: '#e2e8f0' }
                        },
                        x: {
                            ticks: { color: '#64748b', font: { family: 'Inter' } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function formatWeekShort(weekOf) {
            if (!weekOf) return '';
            const d = new Date(weekOf + 'T00:00:00');
            return d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
        }

        function formatWeekFull(weekOf) {
            if (!weekOf) return '';
            const start = new Date(weekOf + 'T00:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            return 'Week of ' + start.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' })
                + ' - ' + end.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ============================================================
        // EMPTY / ERROR / ACCESS DENIED
        // ============================================================
        function showEmpty() {
            document.getElementById('loadingScreen').style.display = 'none';
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="card empty-state">
                    <i class="fas fa-chart-line"></i>
                    <h2>No Progress Data Yet</h2>
                    <p>No sessions have been logged for this student in <strong>${escapeHtml(subject)}</strong> yet.<br>Your tutor will log sessions soon.</p>
                    <a href="javascript:history.back()" class="btn btn-primary" style="margin-top: 15px;">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            `;
            main.style.display = 'block';
        }

        function showAccessDenied() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('accessDenied').style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="card empty-state">
                    <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                    <h2>Something went wrong</h2>
                    <p>${escapeHtml(message)}</p>
                    <a href="javascript:history.back()" class="btn btn-primary" style="margin-top: 15px;">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            `;
            main.style.display = 'block';
        }
    </script>
</body>
</html>

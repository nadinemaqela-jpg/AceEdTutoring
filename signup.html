<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AceEd Tutoring</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #f7f9fc;
            --white: #ffffff;
            --text-main: #1e2a3e;
            --text-muted: #64748b;
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --border: #e2e8f0;
            --radius: 12px;
            --warning: #f39c12;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }
        
        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header img {
            height: 45px;
            margin: 0 auto 15px;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* NEW STUDENT NOTICE BANNER */
        .student-notice {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.4;
        }
        .student-notice i {
            margin-top: 2px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg-color);
        }
        
        .form-group input:focus {
            border-color: var(--primary);
            background: var(--white);
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-family: inherit;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
            margin-top: -10px;
        }
        
        .forgot-password a {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        
        .forgot-password a:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <img src="logo.png" alt="AceEd Tutoring" onerror="this.style.display='none'">
            <h1>Welcome Back</h1>
            <p>Sign in to access your dashboard</p>
        </div>

        <!-- NEW: Student Notice -->
        <div class="student-notice">
            <i class="fas fa-info-circle" style="font-size: 1.1rem;"></i>
            <div>
                <strong>Are you a high school student?</strong><br>
                Student accounts have <strong>view-only</strong> access. Only a parent or legal guardian can make bookings or request tutors.
            </div>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="signinForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            
            <!-- Forgot Password Link -->
            <div class="forgot-password">
                <a onclick="resetPassword()">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-primary" id="signinBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA1PUbGQSYXh41L4_NVX6_X57LDNlaAF4g",
            authDomain: "aceed-tutoring.firebaseapp.com",
            projectId: "aceed-tutoring",
            storageBucket: "aceed-tutoring.firebasestorage.app",
            messagingSenderId: "225577605291",
            appId: "1:225577605291:web:75327bc4e1f644cef47fee"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // ============================================================
        // RESET PASSWORD FUNCTION
        // ============================================================
        function resetPassword() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                alert('Please enter your email address first.');
                return;
            }
            
            auth.sendPasswordResetEmail(email)
                .then(function() {
                    alert('✅ Password reset email sent! Please check your inbox (and spam folder).');
                })
                .catch(function(error) {
                    console.error('Reset password error:', error);
                    alert('❌ Error: ' + error.message);
                });
        }
        
        // ============================================================
        // SIGN IN FORM SUBMISSION
        // ============================================================
        const form = document.getElementById('signinForm');
        const errorDiv = document.getElementById('errorMessage');
        const signinBtn = document.getElementById('signinBtn');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            errorDiv.style.display = 'none';
            signinBtn.disabled = true;
            signinBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check user role
                const doc = await firebase.firestore().collection('users').doc(user.uid).get();
                const userData = doc.data();
                const role = userData.role;
                
                // Redirect based on role
                if (role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (role === 'tutor' || role === 'pending_tutor') {
                    window.location.href = 'tutor-dashboard.html';
                } else if (role === 'parent') {
                    window.location.href = 'parent-dashboard.html';
                } else {
                    window.location.href = 'member-dashboard.html'; // Students go here (view-only)
                }
            } catch (error) {
                console.error('Signin error:', error);
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
                signinBtn.disabled = false;
                signinBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });
    </script>
</body>
</html>

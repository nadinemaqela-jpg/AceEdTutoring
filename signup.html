<body>
    <div class="signup-container">
        <h1><i class="fas fa-user-plus"></i> Create Account</h1>
        <p>Sign up to access resources or request tutoring</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" id="phone" placeholder="e.g., 0631158739">
            </div>
            
            <div class="form-group">
                <label>Password (minimum 6 characters) <span class="required">*</span></label>
                <input type="password" id="password" required placeholder="Create a password" minlength="6">
            </div>
            
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" required placeholder="Confirm your password">
            </div>
            
            <!-- Role Selection -->
            <div class="form-group">
                <label>I am a... <span class="required">*</span></label>
                <div class="radio-group" id="roleGroup">
                    <label class="selected" data-role="student">
                        <i class="fas fa-user-graduate" style="color: #3498db;"></i> Student
                        <input type="radio" name="role" value="student" checked>
                    </label>
                    <label data-role="parent">
                        <i class="fas fa-user-friends" style="color: #27ae60;"></i> Parent
                        <input type="radio" name="role" value="parent">
                    </label>
                </div>
                <div class="role-description" id="roleDescription">Access resources, ATPs, and past papers</div>
            </div>
            
            <div class="form-group">
                <label style="display: flex; align-items: flex-start; gap: 10px; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" id="termsCheck" required style="width: auto; margin-top: 4px;">
                    <span>I have read and agree to the <a href="terms.html" target="_blank" style="color: #3498db;">Terms & Conditions</a> and <a href="terms.html#refund" target="_blank" style="color: #3498db;">Refund & Cancellation Policy</a>.</span>
                </label>
            </div>
            
            <button type="submit" class="btn-signup" id="signupBtn"><i class="fas fa-paper-plane"></i> Sign Up</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="signin.html">Sign In</a>
        </div>
    </div>
    
    <script>
        // ============================================================
        // ROLE SELECTION UI
        // ============================================================
        const roleLabels = document.querySelectorAll('.radio-group label');
        const roleDescription = document.getElementById('roleDescription');
        
        const roleDescriptions = {
            'student': 'Access resources, ATPs, and past papers for FREE',
            'parent': 'Request tutors, manage student accounts, and book sessions'
        };
        
        roleLabels.forEach(function(label) {
            label.addEventListener('click', function() {
                roleLabels.forEach(function(l) { l.classList.remove('selected'); });
                this.classList.add('selected');
                const role = this.dataset.role;
                roleDescription.textContent = roleDescriptions[role] || '';
            });
        });
        
        // ============================================================
        // FORM SUBMISSION
        // ============================================================
        const form = document.getElementById('signupForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const signupBtn = document.getElementById('signupBtn');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const termsChecked = document.getElementById('termsCheck').checked;
            
            // Validate
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Sign Up';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters.';
                errorDiv.style.display = 'block';
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Sign Up';
                return;
            }
            
            if (!termsChecked) {
                errorDiv.textContent = 'Please agree to the Terms & Conditions.';
                errorDiv.style.display = 'block';
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Sign Up';
                return;
            }
            
            try {
                // Create user in Firebase Auth
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Save user data to Firestore
                await firebase.firestore().collection('users').doc(user.uid).set({
                    uid: user.uid,
                    fullName: fullName,
                    email: email,
                    phone: phone || '',
                    role: role,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                
                // Success
                successDiv.textContent = '✅ Account created successfully! Redirecting...';
                successDiv.style.display = 'block';
                
                setTimeout(function() {
                    if (role === 'student') {
                        window.location.href = 'member-dashboard.html';
                    } else if (role === 'parent') {
                        window.location.href = 'parent-dashboard.html';
                    } else {
                        window.location.href = 'member-dashboard.html';
                    }
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Sign Up';
            }
        });
    </script>
</body>

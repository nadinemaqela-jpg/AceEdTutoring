    <style>
        :root {
            --bg-color: #f7f9fc;
            --white: #ffffff;
            --text-main: #1e2a3e;
            --text-muted: #64748b;
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --border: #e2e8f0;
            --radius: 12px;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        
        .form-group label .required {
            color: var(--danger);
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg-color);
        }
        
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            background: var(--white);
        }
        
        /* Role Selection Radios */
        .radio-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
            background: var(--bg-color);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            flex: 1;
            font-size: 0.95rem;
            margin: 0;
        }
        
        .radio-group label:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }
        
        .radio-group label.selected {
            border-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
            font-weight: 600;
        }
        
        .radio-group input[type="radio"] {
            display: none;
        }
        
        .role-description {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }

        /* Terms Checkbox */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);

        .terms-group input {
            margin-top: 4px;
            width: 16px;

        .terms-group a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        .terms-group a:hover {
            text-decoration: underline;
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: white;

            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-family: inherit;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;

        .alert {
            padding: 12px;

            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;

            margin-top: 25px;
            color: var(--text-muted);

                /* NEW STUDENT NOTICE BANNER */
        .student-notice {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px 15px;

<body>
    <div class="auth-card">
        <div class="auth-header">
            <h1><i class="fas fa-user-plus" style="color: var(--primary);"></i> Create Account</h1>
            <p>Sign up to access resources or request tutoring</p>
        </div>
        
        <div id="errorMessage" class="alert alert-error"></div>
        <div id="successMessage" class="alert alert-success"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" id="phone" placeholder="e.g., 0631158739">
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="password" required placeholder="Minimum 6 characters" minlength="6">
            </div>
            
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" required placeholder="Confirm your password">
            </div>
            
            <!-- Role Selection -->
            <div class="form-group">
                <label>I am a... <span class="required">*</span></label>
                <div class="radio-group" id="roleGroup">
                    <label class="selected" data-role="student">
                        <i class="fas fa-user-graduate"></i> Student
                        <input type="radio" name="role" value="student" checked>
                    </label>
                    <label data-role="parent">
                        <i class="fas fa-user-friends"></i> Parent
                        <input type="radio" name="role" value="parent">
                    </label>
                </div>
                <!-- NEW: Student Notice -->
                <div class="student-notice">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <strong>Are you a high school student?</strong><br>
                        Student accounts have <strong>view-only</strong> access. Only a parent or legal guardian can make bookings or request tutors.
                    </div>
                </div>
                <div class="role-description" id="roleDescription">Access resources, ATPs, and past papers</div>
            </div>
            
            <div class="terms-group">
                <input type="checkbox" id="termsCheck" required>
                <label for="termsCheck">
                    I have read and agree to the <a href="terms.html" target="_blank">Terms &amp; Conditions</a> and <a href="terms.html#refund" target="_blank">Refund &amp; Cancellation Policy</a>.
                </label>
            </div>
            
            <button type="submit" class="btn-primary" id="signupBtn">
                <i class="fas fa-paper-plane"></i> Sign Up
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="signin.html">Sign In</a>
        </div>
    </div>
    
    <script>
        // ============================================================
        // ROLE SELECTION UI
        // ============================================================
        const roleLabels = document.querySelectorAll('.radio-group label');
        const roleDescription = document.getElementById('roleDescription');
        
        const roleDescriptions = {
            'student': 'Access resources, ATPs, and past papers for FREE',
            'parent': 'Request tutors, manage student accounts, and book sessions'
        };
        
        roleLabels.forEach(function(label) {
            label.addEventListener('click', function() {
                roleLabels.forEach(function(l) { l.classList.remove('selected'); });
                this.classList.add('selected');
                const role = this.dataset.role;
                roleDescription.textContent = roleDescriptions[role] || '';
            });
        });
        
        // ============================================================
        // FORM SUBMISSION
        // ============================================================
        const form = document.getElementById('signupForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const signupBtn = document.getElementById('signupBtn');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const termsChecked = document.getElementById('termsCheck').checked;
            
            // Validate
            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }
            
            if (!termsChecked) {
                showError('Please agree to the Terms & Conditions.');
                return;
            }
            
            try {
                // Create user in Firebase Auth
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Save user data to Firestore
                await firebase.firestore().collection('users').doc(user.uid).set({
                    uid: user.uid,
                    fullName: fullName,
                    email: email,
                    phone: phone || '',
                    role: role,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                
                // Success
                successDiv.textContent = '✅ Account created successfully! Redirecting...';
                successDiv.style.display = 'block';
                
                setTimeout(function() {
                    if (role === 'student') {
                        window.location.href = 'member-dashboard.html';
                    } else if (role === 'parent') {
                        window.location.href = 'parent-dashboard.html';
                    } else {
                        window.location.href = 'member-dashboard.html';
                    }
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                showError(error.message);
            }
        });

        function showError(message) {
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            signupBtn.disabled = false;
            signupBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Sign Up';
        }
    </script>
</body>

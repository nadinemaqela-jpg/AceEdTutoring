    <!-- Firebase Configuration -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1PUbGQSYXh41L4_NVX6_X57LDNlaAF4g",

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .state-icon { font-size: 4rem; margin-bottom: 20px; display: block; }

        h1 { color: #1e2a3a; margin-bottom: 15px; font-size: 1.6rem; }

        p { color: #7f8c8d; font-size: 1rem; line-height: 1.6; margin-bottom: 10px; }

        .invoice-info {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
        }

        .invoice-info .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .invoice-info .row:last-child { border-bottom: none; }

        .invoice-info .label { color: #7f8c8d; font-size: 0.9rem; }
        .invoice-info .value { color: #1e2a3a; font-weight: 600; }
        .total-amount { color: #27ae60 !important; font-size: 1.2rem !important; }

        /* Payment Method Cards */
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
            text-align: left;
        }

        .method-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .method-card:hover { border-color: #3498db; }

        .method-card.selected {
            border-color: #27ae60;
            background: #f0fdf4;
            box-shadow: 0 4px 10px rgba(39,174,96,0.15);
        }

        .method-card .method-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: block;
        }

        .method-card .method-name {
            font-weight: 700;
            color: #1e2a3a;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .method-card .method-desc {
            font-size: 0.75rem;
            color: #7f8c8d;
            line-height: 1.3;
        }

        /* Upload Section */
        .upload-section {
            margin-top: 20px;
            text-align: left;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 12px;
            display: none;
        }

        .upload-section.active { display: block; }

        .upload-section label {
            display: block;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .upload-section small {
            display: block;
            color: #7f8c8d;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: white;
            border: 2px dashed #3498db;
            border-radius: 10px;
            color: #3498db;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.9rem;
        }

        .file-input-btn:hover {
            background: #f0f8ff;
            border-style: solid;
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #27ae60;
            font-weight: 600;
        }

        .file-name.error { color: #e74c3c; }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 14px 35px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-green { background: #27ae60; }
        .btn-green:hover { box-shadow: 0 5px 15px rgba(39,174,96,0.3); }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .spinner {
            font-size: 4rem;
            color: #f39c12;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-success { color: #27ae60; }
        .status-error { color: #e74c3c; }
        .status-warning { color: #f39c12; }

        @media (max-width: 480px) {
            .payment-methods { grid-template-columns: 1fr; }
            .container { padding: 30px 20px; }
        }
    </style>

<body>
    <div class="container">
        <div id="content">
            <i class="fas fa-spinner spinner"></i>
            <h1>Confirming your payment...</h1>
            <p>Please wait a moment.</p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const invoiceId = params.get('invoice');
        const content = document.getElementById('content');

        let selectedMethod = null;
        let uploadedFile = null;

        firebase.auth().onAuthStateChanged(function(user) {
            if (!invoiceId) {
                showError('Invalid Link', 'No invoice was specified in the link. Please check the email you received.');
                return;
            }

            if (!user) {
                const returnUrl = 'confirm-payment.html?invoice=' + invoiceId;
                content.innerHTML = `
                    <i class="fas fa-user-lock state-icon" style="color: #f39c12;"></i>
                    <h1>Sign In Required</h1>
                    <p>To confirm your payment, please sign in to your AceEd account.</p>
                    <a href="signin.html?redirect=${encodeURIComponent(returnUrl)}" class="btn btn-green" style="margin-top: 20px;">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </a>
                `;
                return;
            }

            checkInvoice(invoiceId);
        });

        async function checkInvoice(id) {
            try {
                const db = firebase.firestore();
                const invoiceDoc = await db.collection('invoices').doc(id).get();

                if (!invoiceDoc.exists) {
                    showError('Invoice Not Found', 'This invoice does not exist in our system. Please contact support at clients@aceed.co.za.');
                    return;
                }

                const invoice = invoiceDoc.data();

                if (invoice.status === 'paid') { showAlreadyPaid(invoice); return; }
                if (invoice.status === 'payment_claimed') { showAlreadyClaimed(invoice); return; }

                showConfirmation(invoice);

            } catch (error) {
                console.error('Error:', error);
                showError('Something went wrong', error.message);
            }
        }

        function showConfirmation(invoice) {
            const itemsHtml = (invoice.items || []).map(item =>
                `<div class="row">
                    <span class="label">${item.name} × ${item.qty}</span>
                    <span class="value">R${item.total.toFixed(2)}</span>
                </div>`
            ).join('');

            content.innerHTML = `
                <i class="fas fa-file-invoice state-icon" style="color: #3498db;"></i>
                <h1>Confirm Payment</h1>
                <p>Tell us how you paid for invoice <strong>${invoice.invoiceNumber}</strong>.</p>

                <div class="invoice-info">
                    <div class="row">
                        <span class="label">Invoice #</span>
                        <span class="value">${invoice.invoiceNumber}</span>
                    </div>
                    <div class="row">
                        <span class="label">Reference</span>
                        <span class="value">${invoice.paymentRef}</span>
                    </div>
                    ${itemsHtml}
                    <div class="row" style="margin-top: 10px; padding-top: 10px; border-top: 2px solid #eee;">
                        <span class="label" style="font-weight: 600;">Total</span>
                        <span class="value total-amount">R${invoice.total.toFixed(2)}</span>
                    </div>
                </div>

                <h3 style="color: #1e2a3a; margin-top: 25px; margin-bottom: 5px; text-align: left;">How did you pay?</h3>
                <p style="text-align: left; font-size: 0.85rem; color: #7f8c8d; margin-bottom: 0;">Select the method you used:</p>

                <div class="payment-methods">
                    <div class="method-card" id="method-payshap" onclick="selectMethod('payshap')">
                        <i class="fas fa-bolt method-icon" style="color: #f39c12;"></i>
                        <div class="method-name">PayShap / Instant EFT</div>
                        <div class="method-desc">Payment reflects immediately</div>
                    </div>
                    <div class="method-card" id="method-eft" onclick="selectMethod('eft')">
                        <i class="fas fa-university method-icon" style="color: #3498db;"></i>
                        <div class="method-name">Bank Transfer (EFT)</div>
                        <div class="method-desc">Upload proof of payment</div>
                    </div>
                </div>

                <div id="uploadSection" class="upload-section">
                    <label><i class="fas fa-paperclip"></i> Upload Proof of Payment</label>
                    <small>PDF or screenshot from your bank app (max 5MB)</small>
                    <div class="file-input-wrapper">
                        <input type="file" id="proofFile" accept=".pdf,.png,.jpg,.jpeg" onchange="handleFileSelect(event)">
                        <label for="proofFile" class="file-input-btn">
                            <i class="fas fa-cloud-upload-alt"></i> Choose File
                        </label>
                    </div>
                    <div id="fileName" class="file-name"></div>
                </div>

                <div class="btn-group">
                    <button id="confirmBtn" onclick="confirmPayment('${invoice.invoiceNumber}')" class="btn btn-green" disabled>
                        <i class="fas fa-check"></i> Confirm Payment
                    </button>
                    <a href="parent-dashboard.html" class="btn" style="background: #95a5a6;">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                </div>
            `;
        }

        function selectMethod(method) {
            selectedMethod = method;

            document.getElementById('method-payshap').classList.remove('selected');
            document.getElementById('method-eft').classList.remove('selected');
            document.getElementById('method-' + method).classList.add('selected');

            const uploadSection = document.getElementById('uploadSection');
            if (method === 'eft') {
                uploadSection.classList.add('active');
            } else {
                uploadSection.classList.remove('active');
                uploadedFile = null;
                document.getElementById('fileName').textContent = '';
            }

            updateConfirmButton();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            const fileNameDiv = document.getElementById('fileName');

            if (!file) {
                uploadedFile = null;
                fileNameDiv.textContent = '';
                updateConfirmButton();
                return;
            }

            // Validate size (5MB)
            if (file.size > 5 * 1024 * 1024) {
                fileNameDiv.textContent = '❌ File too large (max 5MB)';
                fileNameDiv.className = 'file-name error';
                uploadedFile = null;
                updateConfirmButton();
                return;
            }

            uploadedFile = file;
            fileNameDiv.textContent = '✓ ' + file.name;
            fileNameDiv.className = 'file-name';
            updateConfirmButton();
        }

        function updateConfirmButton() {
            const btn = document.getElementById('confirmBtn');
            if (!btn) return;

            if (!selectedMethod) {
                btn.disabled = true;
                return;
            }

            if (selectedMethod === 'eft' && !uploadedFile) {
                btn.disabled = true;
                return;
            }

            btn.disabled = false;
        }

        async function confirmPayment(invoiceNumber) {
            if (!selectedMethod) {
                alert('Please select a payment method.');
                return;
            }

            if (selectedMethod === 'eft' && !uploadedFile) {
                alert('Please upload your proof of payment.');
                return;
            }

            content.innerHTML = `
                <i class="fas fa-spinner spinner"></i>
                <h1>Confirming...</h1>
                <p>${selectedMethod === 'eft' ? 'Uploading proof and confirming...' : 'Please wait a moment.'}</p>
            `;

            try {
                const db = firebase.firestore();
                const user = firebase.auth().currentUser;

                let proofData = null;

                // Upload proof if EFT
                if (selectedMethod === 'eft' && uploadedFile) {
                    const storageRef = firebase.storage()
                        .ref('payment-proofs/' + invoiceId + '/' + Date.now() + '_' + uploadedFile.name);
                    const snapshot = await storageRef.put(uploadedFile);
                    const downloadURL = await snapshot.ref.getDownloadURL();

                    proofData = {
                        url: downloadURL,
                        filename: uploadedFile.name,
                        uploadedAt: new Date().toISOString(),
                        uploadedBy: user.uid
                    };
                }

                // Update invoice
                const updateData = {
                    status: 'payment_claimed',
                    claimedAt: new Date().toISOString(),
                    paymentMethod: selectedMethod
                };

                if (proofData) {
                    updateData.proofOfPayment = proofData;
                }

                await db.collection('invoices').doc(invoiceId).update(updateData);

                // Get invoice for email
                const invoiceDoc = await db.collection('invoices').doc(invoiceId).get();
                const invoice = invoiceDoc.data();

                // Notify Admin
                const methodLabel = selectedMethod === 'payshap' ? 'PayShap / Instant EFT' : 'Bank Transfer (EFT)';
                const proofLine = proofData
                    ? `<p><strong>Proof:</strong> <a href="${proofData.url}">${proofData.filename}</a></p>`
                    : `<p><strong>Proof:</strong> Not required (instant payment)</p>`;

                await db.collection('mail').add({
                    to: 'admin@aceed.co.za',
                    message: {
                        subject: '💳 Payment Claimed: ' + invoice.invoiceNumber,
                        html: `
                            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                                <div style="background: #1e2a3a; color: white; padding: 20px; text-align: center;">
                                    <h1 style="margin: 0;">AceEd Tutoring</h1>
                                    <p style="color: #f39c12; margin: 5px 0 0;">✦ Affordable Services ✦</p>
                                </div>
                                <div style="padding: 25px; background: #f9f9f9;">
                                    <h2>Payment Claimed ✅</h2>
                                    <p><strong>Invoice:</strong> ${invoice.invoiceNumber}</p>
                                    <p><strong>Parent:</strong> ${invoice.parentName}</p>
                                    <p><strong>Email:</strong> ${invoice.parentEmail}</p>
                                    <p><strong>Phone:</strong> ${invoice.parentPhone || 'Not provided'}</p>
                                    <p><strong>Amount:</strong> R${invoice.total.toFixed(2)}</p>
                                    <p><strong>Reference:</strong> ${invoice.paymentRef}</p>
                                    <p><strong>Method:</strong> ${methodLabel}</p>
                                    ${proofLine}
                                    <hr>
                                    <p>Please verify the payment and mark the invoice as paid.</p>
                                    <p><a href="https://aceed.co.za/admin.html" style="background: #3498db; color: white; padding: 12px 30px; text-decoration: none; border-radius: 30px;">Go to Admin Dashboard</a></p>
                                </div>
                                <div style="background: #0f1720; color: #a0aec0; padding: 15px; text-align: center; font-size: 12px;">
                                    <p style="margin:0;">© 2026 AceEd Tutoring</p>
                                </div>
                            </div>
                        `
                    }
                });

                showSuccess(invoice, selectedMethod);

            } catch (error) {
                console.error('Error:', error);
                showError('Could not confirm payment', error.message);
            }
        }

        function showSuccess(invoice, method) {
            const methodLabel = method === 'payshap'
                ? 'PayShap / Instant EFT'
                : 'Bank Transfer (EFT)';

            content.innerHTML = `
                <i class="fas fa-check-circle state-icon status-success"></i>
                <h1 class="status-success">Payment Confirmed!</h1>
                <p>Thank you for confirming your payment.</p>

                <div class="invoice-info">
                    <div class="row">
                        <span class="label">Invoice #</span>
                        <span class="value">${invoice.invoiceNumber}</span>
                    </div>
                    <div class="row">
                        <span class="label">Reference</span>
                        <span class="value">${invoice.paymentRef}</span>
                    </div>
                    <div class="row">
                        <span class="label">Amount</span>
                        <span class="value total-amount">R${invoice.total.toFixed(2)}</span>
                    </div>
                    <div class="row">
                        <span class="label">Method</span>
                        <span class="value">${methodLabel}</span>
                    </div>
                </div>

                <p style="margin-top: 20px;">Our team will verify your payment within 24 hours and activate your tutoring services.</p>

                <a href="parent-dashboard.html" class="btn btn-green" style="margin-top: 20px;">
                    <i class="fas fa-arrow-left"></i> Go to Dashboard
                </a>
            `;
        }

        function showAlreadyPaid(invoice) {
            content.innerHTML = `
                <i class="fas fa-check-circle state-icon status-success"></i>
                <h1 class="status-success">Already Paid</h1>
                <p>This invoice (<strong>${invoice.invoiceNumber}</strong>) has already been marked as paid.</p>
                <p>Thank you for your payment!</p>
                <a href="parent-dashboard.html" class="btn btn-green" style="margin-top: 20px;">
                    <i class="fas fa-arrow-left"></i> Go to Dashboard
                </a>
            `;
        }

        function showAlreadyClaimed(invoice) {
            content.innerHTML = `
                <i class="fas fa-clock state-icon status-warning"></i>
                <h1 class="status-warning">Already Confirmed</h1>
                <p>You've already confirmed payment for this invoice (<strong>${invoice.invoiceNumber}</strong>).</p>
                <p>Our team is verifying it now. You'll be notified once it's activated.</p>
                <a href="parent-dashboard.html" class="btn" style="background: #f39c12; margin-top: 20px;">
                    <i class="fas fa-arrow-left"></i> Go to Dashboard
                </a>
            `;
        }

        function showError(title, message) {
            content.innerHTML = `
                <i class="fas fa-exclamation-triangle state-icon status-error"></i>
                <h1 class="status-error">${title}</h1>
                <p>${message}</p>
                <p style="margin-top: 15px;">Need help? Email <strong>clients@aceed.co.za</strong> or WhatsApp <strong>+27 65 529 4232</strong>.</p>
                <a href="index.html" class="btn" style="margin-top: 20px;">
                    <i class="fas fa-home"></i> Go Home
                </a>
            `;
        }
    </script>
</body>
</html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        .bio-text { color: #475569; font-size: 1rem; margin-bottom: 25px; }

        .tabs { display: flex; gap: 20px; border-bottom: 1px solid #e2e8f0; margin-bottom: 20px; }
        .tab { padding: 10px 0; cursor: pointer; color: #2563eb; font-weight: 600; font-size: 0.95rem; border-bottom: 2px solid #2563eb; }
        
        .schedule-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .schedule-header h3 { font-size: 1.2rem; color: #1e2a3e; }

        .time-slot.selected { background: #1e3a8a; border-color: #1e3a8a; color: white; font-weight: 600; }

<body>

    <div class="profile-container" id="profileContainer">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
            <i class="fas fa-spinner fa-spin fa-3x" style="color: #2563eb;"></i>
            <p style="margin-top: 20px;">Loading tutor profile...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1PUbGQSYXh41L4_NVX6_X57LDNlaAF4g",
            authDomain: "aceed-tutoring.firebaseapp.com",
            projectId: "aceed-tutoring",
            storageBucket: "aceed-tutoring.firebasestorage.app",
            messagingSenderId: "225577605291",
            appId: "1:225577605291:web:75327bc4e1f644cef47fee"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let currentTutor = null;

        // BACKUP DATA FOR TESTING
        const fallbackTutors = {
            "nkululeko": {
                id: "nkululeko", fullName: "Nkululeko", 
                university: "UKZN", degree: "Mechanical Engineering",
                subjects: ["Mathematics (Gr 10-12)", "Physical Sciences (Gr 10-12)", "Life Sciences (Gr 10-12)"],
                bio: "I focus heavily on past papers and exam technique, helping Matrics jump from 50% to 70%+ in Maths and Physics.",
                email: "nkululeko@test.com"
            },
            "mihlali": {
                id: "mihlali", fullName: "Mihlali Nadine", 
                university: "Stellenbosch University", degree: "Data Engineering",
                subjects: ["Mathematics (Gr 10-12)", "Mathematical Literacy (Gr 10-12)", "Physical Sciences (Gr 10-12)"],
                bio: "Engineering student with a proven track record of helping students break down complex equations step-by-step.",
                email: "mihlali@test.com"
            },
            "cindy-lee": {
                id: "cindy-lee", fullName: "Cindy-Lee", 
                university: "Stellenbosch University", degree: "",
                subjects: ["Mathematics (Gr 6-12)", "English HL (Gr 6-12)", "Afrikaans (Gr 6-12)", "Life Sciences (Gr 10-12)", "Accounting (Gr 10-12)"],
                bio: "Versatile tutor specializing in Languages and Accounting. I guarantee a patient, structured approach to learning.",
                email: "cindy@test.com"
            },
            "fortunate": {
                id: "fortunate", fullName: "Fortunate", 
                university: "Stellenbosch University", degree: "Data Engineering",
                subjects: ["Mathematics (Gr 10-12)", "Physics (Gr 10-12)", "Life Sciences (Gr 10-12)", "Geography (Gr 10-12)"],
                bio: "Committed to academic excellence and helping students reach their full potential.",
                email: "fortunate@test.com"
            }
        };

        function buildEmailBody(innerHtml) {
            return `
                <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                    <div style="background: #1e2a3a; color: white; padding: 20px; text-align: center;">
                        <h1 style="margin: 0;">AceEd Tutoring</h1>
                    </div>
                    <div style="padding: 25px; background: #f9f9f9;">${innerHtml}</div>
                </div>
            `;
        }

        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const tutorId = urlParams.get('tutorId');

            if (!tutorId) {
                document.getElementById('profileContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center; padding:50px;">Tutor not found.</h2>`;
                return;
            }

            try {
                const doc = await db.collection('users').doc(tutorId).get();
                
                // If found in database
                if (doc.exists) {
                    currentTutor = { id: doc.id, ...doc.data() };
                } 
                // If NOT found in database, use the fallback
                else if (fallbackTutors[tutorId]) {
                    currentTutor = fallbackTutors[tutorId];
                } 
                // If truly not found anywhere
                else {
                    document.getElementById('profileContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center; padding:50px;">Tutor not found.</h2>`;
                    return;
                }
                
                renderProfile(currentTutor);

            } catch (error) {
                console.error("Error loading profile from Firebase. Trying fallback...", error);
                // Fallback on database error too
                if (fallbackTutors[tutorId]) {
                    currentTutor = fallbackTutors[tutorId];
                    renderProfile(currentTutor);
                } else {
                    document.getElementById('profileContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center; padding:50px;">Error loading profile.</h2>`;
                }
            }
        }

        function renderProfile(tutor) {
            const container = document.getElementById('profileContainer');
            const subjectTags = (tutor.subjects || []).map(s => `<span class="tag">${s}</span>`).join('');
            const fallbackImg = `https://ui-avatars.com/api/?name=${tutor.fullName.replace(' ', '+')}&background=random`;

            container.innerHTML = `
                <div class="main-content">
                    <div class="header-info">
                        <img src="tutors/${tutor.fullName.split(' ')[0].toLowerCase()}.png" onerror="this.src='${fallbackImg}'" class="tutor-avatar" alt="${tutor.fullName}">
                        <div>
                            <h1 class="tutor-name">${tutor.fullName} <i class="fas fa-check-circle" title="Verified Tutor"></i></h1>
                            <div class="tutor-title"><i class="fas fa-graduation-cap"></i> ${tutor.university} ${tutor.degree ? '• ' + tutor.degree : ''}</div>
                        </div>
                    </div>

                    <div class="trust-badge">
                        <i class="fas fa-shield-check fa-lg"></i>
                        <div><strong>100% Vetted & Verified</strong><br>ID, transcript, and competency interview passed.</div>
                    </div>

                    <p class="bio-text">${tutor.bio || "Hello! I am a dedicated tutor ready to help you succeed."}</p>
                    <div class="tags">${subjectTags}</div>

                    <div class="tabs">
                        <div class="tab">Select Date & Time</div>
                    </div>

                    <div class="schedule-header">
                        <h3>Available Times (Next 7 Days)</h3>
                    </div>
                    
                    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">These are once-off, individual sessions.</p>

                    <div class="calendar-controls">
                        <span>Select a time slot below</span>
                    </div>

                    <div class="calendar-days">
                        ${generateTimeSlots(tutor.availability)}
                    </div>
                </div>

                <div class="sidebar-card">
                    <div class="price-display">
                        R100<span>/hr</span>
                    </div>

                    <!-- NEW DISCLAIMER -->
                    <div style="background: #fff3cd; border-left: 4px solid #e74c3c; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; color: #721c24;">
                        <p style="margin: 0 0 5px 0;"><i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i> <strong>Strictly for Parents/Guardians</strong></p>
                        <p style="margin: 0;">Students high school learners are <strong>not permitted</strong> to make bookings for themselves.</p>
                    </div>
                    
                    <div class="form-group">
                        <label>Subject Needed *</label>
                        <select id="bookingSubject" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
                            <option value="">Select a subject...</option>
                            ${(tutor.subjects || []).map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Lesson Duration</label>
                        <select id="sessionDuration" onchange="updateSelection()" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
                            <option value="1">1 Hour</option>
                            <option value="2">2 Hours</option>
                            <option value="3">3 Hours</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Your Email (for confirmation)</label>
                        <input type="email" id="parentEmail" placeholder="your@email.com" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
                    </div>

                    <!-- NEW CHECKBOX -->
                    <div style="margin-bottom: 15px; font-size: 0.85rem; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; margin: 0;">
                            <input type="checkbox" id="parentConfirm" style="margin-top: 3px; width: 16px; height: 16px;">
                            <span>I confirm that I am the parent or legal guardian of this student.</span>
                        </label>
                    </div>
                    
                    <button class="btn-book" onclick="sendBookingRequest()">Request Session</button>

                    <div style="margin-top: 20px; font-size: 0.85rem; color: #64748b; text-align: center;">
                        <p><i class="fas fa-info-circle"></i> Booking is NOT confirmed yet.</p>
                        <p style="margin-top: 5px;">The tutor will receive an email to confirm they are available. If not, they will suggest a new time.</p>
                    </div>
                </div>
            `;

            // Attach smart click events to time slots
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.addEventListener('click', function() {
                    // 1. Clear all previous selections
                    document.querySelectorAll('.time-slot').forEach(s => {
                        s.classList.remove('selected');
                        s.style.opacity = '1';
                    });

                    // 2. Get the selected duration
                    const duration = parseInt(document.getElementById('sessionDuration').value);

                    // 3. Highlight the clicked slot
                    this.classList.add('selected');

                    // 4. Find and highlight the next hours if duration > 1
                    if (duration > 1) {
                        const clickedDay = this.getAttribute('data-day');
                        const startHour = parseInt(this.getAttribute('data-start').split(':')[0]);
                        
                        // Loop to find the next consecutive hours
                        for (let i = 1; i < duration; i++) {
                            const nextHourStr = (startHour + i).toString().padStart(2, '0') + ':00';
                            
                            // Find the slot with the same day and the next hour
                            const nextSlot = Array.from(document.querySelectorAll('.time-slot')).find(s => 
                                s.getAttribute('data-day') === clickedDay && 
                                s.getAttribute('data-start') === nextHourStr
                            );

                            if (nextSlot) {
                                nextSlot.classList.add('selected');
                            } else {
                                // If they don't have the next hour available, we can alert them
                                // or just let the backend handle the mismatch.
                                console.log("Warning: Tutor doesn't have consecutive hours available for this duration.");
                            }
                        }
                    }
                });
            });
        }

        async function sendBookingRequest() {
            // 1. Check if the parent confirmed they are not a student
            const confirmCheck = document.getElementById('parentConfirm');
            if (!confirmCheck || !confirmCheck.checked) {
                alert("You must confirm that you are the parent or legal guardian to proceed.");
                return;
            }

            // 2. Get the form values
                        const selectedTime = document.querySelector('.time-slot.selected');
            const parentEmail = document.getElementById('parentEmail').value;
            const duration = document.getElementById('sessionDuration').value;
            const subject = document.getElementById('bookingSubject').value; // Get Subject
            const btn = document.querySelector('.btn-book');

            // 3. Validation
            if (!subject) {
                alert("Please select a subject.");
                return;
            }
            // 3. Validation
            if (!selectedTime) {
                alert("Please select a time slot first.");
                return;
            }
            if (!parentEmail) {
                alert("Please enter your email address so we can notify you.");
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            // Calculate total price (Assuming R100 per hour based on your previous screenshot)
            const totalPrice = parseInt(duration) * 100;

            try {
                // 4. Generate Sequential Booking Reference
                const counterRef = db.collection('settings').doc('counters');
                let finalBookingRef = '';

                await db.runTransaction(async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    let currentCount = 0;
                    
                    if (counterDoc.exists) {
                        currentCount = counterDoc.data().invoiceCount || 0; 
                    }

                    const newCount = currentCount + 1;
                    const paddedCount = newCount.toString().padStart(3, '0'); // e.g., 001

                    // Since it's a 1-on-1 booking without a specific child profile attached yet, 
                    // we default to 'Student'. If you later ask for the child's name on this form, 
                    // you can swap 'Student' for their surname!
                    finalBookingRef = `ACE-Student-${paddedCount}`; 

                    transaction.set(counterRef, { invoiceCount: newCount }, { merge: true });
                });

                // 5. Save to database
                await db.collection('bookings').add({
                    tutorId: currentTutor.id,
                    tutorName: currentTutor.fullName,
                    tutorEmail: currentTutor.email || 'tutor@aceed.co.za',
                    parentEmail: parentEmail,
                    subject: subject,
                    timeSlot: selectedTime.textContent.trim(),
                    duration: duration,
                    totalPrice: totalPrice,
                    paymentRef: finalBookingRef, // <-- Added the reference
                    status: 'pending_tutor_confirmation',
                    createdAt: new Date().toISOString()
                });

                // 5. Queue Email to Parent
                await db.collection('mail').add({
                    to: parentEmail,
                    message: {
                        subject: 'Booking Request Received - AceEd Tutoring',
                        html: buildEmailBody(`
                            <h2>Request Received</h2>
                            <p>We have sent your request to <strong>${currentTutor.fullName}</strong> for <strong>${selectedTime.textContent.trim()} (${duration} hours)</strong>.</p>
                            <p><strong>Status:</strong> Pending Tutor Confirmation.</p>
                            <p>If the tutor is available, you will receive a confirmation email shortly. If not, they will suggest a new time.</p>
                        `)
                    }
                });

                // 6. Queue Email to Admin
                await db.collection('mail').add({
                    to: 'admin@aceed.co.za',
                    message: {
                        subject: 'New Booking Request (Pending Tutor)',
                        html: buildEmailBody(`
                            <h2>New Booking Request</h2>
                            <p><strong>Tutor:</strong> ${currentTutor.fullName}</p>
                            <p><strong>Parent Email:</strong> ${parentEmail}</p>
                            <p><strong>Time:</strong> ${selectedTime.textContent.trim()} (${duration} hours)</p>
                            <p><strong>Potential Value:</strong> R${totalPrice}</p>
                        `)
                    }
                });

                // 7. Success UI
                document.getElementById('profileContainer').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; background: white; padding: 50px; border-radius: 12px; border: 1px solid #e2e8f0;">
                        <i class="fas fa-paper-plane" style="font-size: 4rem; color: #2563eb; margin-bottom: 20px;"></i>
                        <h2>Request Sent!</h2>
                        <p style="color: #64748b; margin-top: 10px;">We have emailed <strong>${currentTutor.fullName}</strong> to check their availability.</p>
                        <p style="color: #64748b; margin-top: 5px;">You will receive a confirmation email at <strong>${parentEmail}</strong> as soon as they confirm.</p>
                        <a href="tutors.html" class="btn-book" style="max-width: 300px; margin: 30px auto 0; text-decoration: none; display: inline-block;">Back to Tutors</a>
                    </div>
                `;

            } catch (error) {
                console.error("Booking error:", error);
                alert("Something went wrong. Please try again.");
                btn.innerHTML = 'Request Session';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);


            function generateTimeSlots(availability) {
            if (!availability || Object.keys(availability).length === 0) {
                return `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: #64748b;">No availability set by tutor yet. Please check back later.</div>`;
            }

            let slotsHTML = '';
            // Loop through the days the tutor is available
            for (const [day, times] of Object.entries(availability)) {
                if (times.start && times.end) {
                    // We display it exactly how they entered it: "Monday 14:00 - 16:00"
                    slotsHTML += `<div class="time-slot" data-day="${day}" data-start="${times.start}" data-end="${times.end}">${day} ${times.start} - ${times.end}</div>`;
                }
            }
            return slotsHTML;
        }

        function generateTimeSlots(availability) {
            if (!availability || Object.keys(availability).length === 0) {
                return `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: #64748b;">No availability set by tutor yet. Please check back later.</div>`;
            }

            let slotsHTML = '';
            
            // Loop through the days the tutor is available
            for (const [day, times] of Object.entries(availability)) {
                if (times.start && times.end) {
                    // Parse the start and end times (e.g., "14:00" and "18:00")
                    let startHour = parseInt(times.start.split(':')[0]);
                    let endHour = parseInt(times.end.split(':')[0]);
                    
                    // Create a separate 1-hour slot for every hour in the block
                    for (let hour = startHour; hour < endHour; hour++) {
                        const timeStr = hour.toString().padStart(2, '0') + ':00';
                        const nextHourStr = (hour + 1).toString().padStart(2, '0') + ':00';
                        
                        // Added a line break so it looks like a neat card
                        slotsHTML += `
                            <div class="time-slot" data-day="${day}" data-start="${timeStr}" data-end="${nextHourStr}">
                                ${day} <br> 
                                <span style="font-size: 0.8rem; color: #64748b;">${timeStr} - ${nextHourStr}</span>
                            </div>
                        `;
                    }
                }
            }
            return slotsHTML;
        }

                function updateSelection() {
            // Find the currently selected slot
            const selectedSlot = document.querySelector('.time-slot.selected');
            if (selectedSlot) {
                // Trigger a click on it to re-run the logic with the new duration
                selectedSlot.click();
            }
        }
    </script>
